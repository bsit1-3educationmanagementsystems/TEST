<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - I.S.K.O.L.A.R</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; }
        
        /* Added a container to position the heading and logout button */
        .header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        h1 { color: #333; margin: 0; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #fff; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #004d40; color: white; }
        .approve-btn { background-color: #28a745; color: white; border: none; padding: 8px 12px; cursor: pointer; border-radius: 4px; }
        .approve-btn:hover { background-color: #218838; }
        .decline-btn { background-color: #dc3545; color: white; border: none; padding: 8px 12px; cursor: pointer; border-radius: 4px; margin-left: 8px; }
        .decline-btn:hover { background-color: #c82333; }
        
        /* Styling for the logout button */
        .logout-btn { background-color: #6c757d; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .logout-btn:hover { background-color: #5a6268; }
        
        .empty-message { padding: 20px; color: #666; font-style: italic; }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>Admin Dashboard - Pending Teacher Approvals</h1>
        <button id="logoutBtn" class="logout-btn">Logout</button>
    </div>
    
    <p>Review and approve or decline teacher accounts below.</p>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Institution</th>
                <th>Date Applied</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="pendingTeachersList">
            <!-- Data will be injected here via JavaScript -->
        </tbody>
    </table>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

// IMPORT FIREBASE AUTH FOR LOGOUT
import { 
    getAuth, 
    signOut 
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import { 
    getFirestore, 
    collection, 
    query, 
    where, 
    getDocs, 
    updateDoc, 
    doc 
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDeXxlaxk1nCVQ9k8tMiEs9o-EcLrkTSPE",
  authDomain: "iskolar-website.firebaseapp.com",
  projectId: "iskolar-website",
  appId: "1:1034904541958:web:39eee81131f0a09a991c87"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// INITIALIZE AUTH
const auth = getAuth(app);

const tableBody = document.getElementById('pendingTeachersList');

// Fetch Pending Teachers
async function loadPendingTeachers() {
    tableBody.innerHTML = "<tr><td colspan='5'>Loading...</td></tr>";
    
    try {
        const q = query(
            collection(db, "users"), 
            where("accountType", "==", "teacher"), 
            where("status", "==", "pending")
        );
        
        const querySnapshot = await getDocs(q);
        tableBody.innerHTML = ""; // Clear loading text

        if (querySnapshot.empty) {
            tableBody.innerHTML = "<tr><td colspan='5' class='empty-message'>No pending teacher approvals at this time.</td></tr>";
            return;
        }

        querySnapshot.forEach((docSnapshot) => {
            const data = docSnapshot.data();
            const dateStr = data.createdAt ? data.createdAt.toDate().toLocaleDateString() : 'N/A';
            
            const tr = document.createElement('tr');
            
            tr.innerHTML = `
                <td>${data.name}</td>
                <td>${data.email}</td>
                <td>${data.school}</td>
                <td>${dateStr}</td>
                <td>
                    <button class="approve-btn" data-id="${docSnapshot.id}">Approve</button>
                    <button class="decline-btn" data-id="${docSnapshot.id}">Decline</button>
                </td>
            `;
            tableBody.appendChild(tr);
        });

        // Add event listeners to the approve buttons
        document.querySelectorAll('.approve-btn').forEach(btn => {
            btn.addEventListener('click', (e) => approveTeacher(e.target.getAttribute('data-id')));
        });

        // Add event listeners to the decline buttons
        document.querySelectorAll('.decline-btn').forEach(btn => {
            btn.addEventListener('click', (e) => declineTeacher(e.target.getAttribute('data-id')));
        });

    } catch (error) {
        console.error("Error fetching teachers: ", error);
        tableBody.innerHTML = "<tr><td colspan='5' style='color:red;'>Error loading data. Check console.</td></tr>";
    }
}

// Approve Teacher Function
async function approveTeacher(userId) {
    if(!confirm("Are you sure you want to approve this teacher?")) return;

    try {
        const userRef = doc(db, "users", userId);
        await updateDoc(userRef, {
            status: "approved"
        });
        
        alert("Teacher approved successfully!");
        loadPendingTeachers(); // Refresh the list

    } catch (error) {
        console.error("Error approving teacher: ", error);
        alert("Failed to approve teacher. Check console for details.");
    }
}

// Decline Teacher Function
async function declineTeacher(userId) {
    if(!confirm("Are you sure you want to decline this teacher?")) return;

    try {
        const userRef = doc(db, "users", userId);
        // Updates the status to 'declined'. You can also delete the doc entirely if preferred.
        await updateDoc(userRef, {
            status: "declined" 
        });
        
        alert("Teacher request declined.");
        loadPendingTeachers(); // Refresh the list

    } catch (error) {
        console.error("Error declining teacher: ", error);
        alert("Failed to decline teacher. Check console for details.");
    }
}

// Logout Function
document.getElementById('logoutBtn').addEventListener('click', () => {
    signOut(auth).then(() => {
        // Sign-out successful, redirect to index.html
        window.location.href = "index.html";
    }).catch((error) => {
        // An error happened
        console.error("Error signing out: ", error);
        alert("Failed to log out. Please try again.");
    });
});

// Load data on page load
window.onload = loadPendingTeachers;
</script>

</body>
</html>
